version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=example
      - DB_NAME=profesores_db
      - DB_PORT=3306  
    depends_on:
      - db  

  frontend:
    build:
      context: ./frontend  
      dockerfile: Dockerfile 
    ports:
      - "3000:3000"  
    depends_on:
      - backend  

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example  
      MYSQL_DATABASE: profesores_db    
    ports:
      - "3311:3306"
    volumes:
      - mysql_data:/var/lib/mysql  

volumes:
  mysql_data:
